name: Bootstrap proyecto completo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir proyecto
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part00 .bootstrap/part01 .bootstrap/part02 .bootstrap/part03 .bootstrap/part04 .bootstrap/part05 .bootstrap/part06 > /tmp/project.tgz.b64
          base64 -d /tmp/project.tgz.b64 > /tmp/project.tgz
          tar -xzf /tmp/project.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Publicar proyecto
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: completar Trabajo Final Mi Ciudad"
          git push
