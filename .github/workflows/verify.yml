name: Verificación mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mobile-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Validar versiones Expo
        run: npx expo install --check
      - name: Verificar integridad SDK y configuración con Expo Doctor
        run: npx expo-doctor@latest
      - name: Validar scripts de fotografías
        run: |
          node --check scripts/instalar-fotos-locales.mjs
          node --check scripts/auditar-fotos-externas.mjs
          node --check scripts/reporte-fotos.mjs
          node --check scripts/verificar-entrega.mjs
      - name: Revisar sintaxis del diagnostico PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/diagnosticar-backend-windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
      - name: Revisar sintaxis del instalador de fotografías Commons
        run: node --check scripts/descargar-fotos-commons.mjs
      - name: Validar configuración Expo dinámica (mapas opcionales)
        run: |
          node --check app.config.js
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const cfg=require('./app.config.js');
          const base=require('./app.json').expo;
          delete process.env.GOOGLE_MAPS_ANDROID_API_KEY;
          const web=cfg({config:base});
          assert.equal(web.extra.androidNativeMapsEnabled,false);
          assert.equal(web.extra.eas.projectId,base.extra.eas.projectId);
          assert.deepEqual(web.plugins,base.plugins);
          process.env.GOOGLE_MAPS_ANDROID_API_KEY='clave-ficticia-solo-ci';
          const native=cfg({config:base});
          assert.equal(native.extra.androidNativeMapsEnabled,true);
          assert.equal(native.plugins.at(-1)[0],'react-native-maps');
          assert.equal(native.plugins.at(-1)[1].androidGoogleMapsApiKey,'clave-ficticia-solo-ci');
          NODE
          npx expo config --type public > /dev/null
      - name: Validar sintaxis de reprogramación segura de eventos
        run: node --check scripts/reprogramar-eventos-demo.mjs
      - name: Pruebas de imágenes de la API docente
        run: node --test scripts/test-imagenes-api.mjs
      - name: Pruebas de cierre: avisos locales y fotos verificadas
        run: node --test scripts/test-cierre-mobile.mjs
      - name: Validar diagnóstico completo de imágenes para el grupo
        run: node --check scripts/diagnosticar-imagenes-grupo.mjs
      - name: Revisar sintaxis de conexión remota PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/conectar-grupo-remoto-windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
      - name: Revisar sintaxis del preparador de fotos API PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/preparar-fotos-api-windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
      - name: Validar sintaxis TypeScript del importador de fotos del backend
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import ts from 'typescript';
          const path = 'tools/api-mi-ciudad/importar-fotos-lugares.ts';
          const code = readFileSync(path, 'utf8');
          const archivo = ts.createSourceFile(path, code, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const errores = archivo.parseDiagnostics;
          if (errores.length) {
            console.error(errores.map(e => ts.flattenDiagnosticMessageText(e.messageText, '\\n')));
            process.exitCode = 1;
          }
          NODE
      - name: TypeScript
        run: npm run typecheck
